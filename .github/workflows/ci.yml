name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: PlatformIO Firmware Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Verify Governance Files
        run: |
          for file in README.md LICENSE CONTRIBUTING.md SECURITY.md platformio.ini; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing."
              exit 1
            fi
          done

      - name: Compile Firmware for Arduino Leonardo
        run: pio run
